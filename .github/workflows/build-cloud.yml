name: Docker Build Cloud

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preflight:
    name: Validate six Docker build inputs
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source without persisted credentials
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Check six Dockerfiles
        shell: bash
        run: |
          set -euo pipefail
          for file in \
            api.Dockerfile \
            bot.Dockerfile \
            front-end.Dockerfile \
            loader.Dockerfile \
            pdf_bot.Dockerfile \
            pull_model.Dockerfile
          do
            test -s "$file" || { echo "::error file=$file::Missing or empty Dockerfile"; exit 1; }
            echo "Found $file"
          done

      - name: Validate Docker Compose without starting containers
        run: docker compose -f docker-compose.yml config --quiet

  build:
    name: Cloud build (${{ matrix.dockerfile }})
    # Cloud builds must be initiated manually against the trusted default branch.
    # Environment protections must be configured by the repo owner before activation.
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    needs: preflight
    environment: docker-build-cloud
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        dockerfile:
          - api.Dockerfile
          - bot.Dockerfile
          - front-end.Dockerfile
          - loader.Dockerfile
          - pdf_bot.Dockerfile
          - pull_model.Dockerfile
    steps:
      - name: Check out trusted source without persisted credentials
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Verify authorized Docker credentials and builder configuration
        shell: bash
        env:
          DOCKER_ACCOUNT: ${{ vars.DOCKER_ACCOUNT }}
          CLOUD_BUILDER_NAME: ${{ vars.CLOUD_BUILDER_NAME }}
          DOCKER_ACCESS_TOKEN: ${{ secrets.DOCKER_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "$DOCKER_ACCOUNT" ]]; then
            echo "::error::DOCKER_ACCOUNT variable is unavailable"
            exit 1
          fi
          if [[ -z "$CLOUD_BUILDER_NAME" ]]; then
            echo "::error::CLOUD_BUILDER_NAME variable is unavailable"
            exit 1
          fi
          if [[ -z "$DOCKER_ACCESS_TOKEN" ]]; then
            echo "::error::DOCKER_ACCESS_TOKEN secret is unavailable"
            exit 1
          fi
          echo "Docker credential and builder configuration inputs are present; validity not yet proven"

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKER_ACCOUNT }}
          password: ${{ secrets.DOCKER_ACCESS_TOKEN }}

      - name: Set up Docker Build Cloud
        uses: docker/setup-buildx-action@v4
        with:
          driver: cloud
          endpoint: ${{ vars.DOCKER_ACCOUNT }}/${{ vars.CLOUD_BUILDER_NAME }}

      - name: Build without publishing an image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./${{ matrix.dockerfile }}
          push: false
          outputs: type=cacheonly
